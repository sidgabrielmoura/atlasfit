name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlasfit_test
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: atlasfit_gym_stabilization_20261001
        ports: ["56432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://atlasfit_test:isolated-test-password@127.0.0.1:56432/atlasfit_gym_stabilization_20261001
      DIRECT_URL: postgresql://atlasfit_test:isolated-test-password@127.0.0.1:56432/atlasfit_gym_stabilization_20261001
      GYM_TEST_DATABASE_URL: postgresql://atlasfit_test:isolated-test-password@127.0.0.1:56432/atlasfit_gym_stabilization_20261001
      AUTH_SECRET: isolated-gym-test-secret-not-for-production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:bootstrap
      - run: npm test -- --no-file-parallelism
      - run: npm run test:gym
      - run: npm run build
